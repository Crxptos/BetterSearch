name: Build Geode Mod

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - target: Android64
            cli: android64
          - target: Win64
            cli: win64

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y ninja-build p7zip-full

      # Install Geode CLI
      - name: Setup Geode CLI
        uses: geode-sdk/cli/.github/actions/setup@main

      # ✅ Proper non-interactive profile setup
      - name: Setup Geode profile
        run: |
          export GEODE_CLI_HOME="$GITHUB_WORKSPACE/geode-cli"
          mkdir -p "$GEODE_CLI_HOME"

          printf "GithubActions\n\n\n\n" | geode config setup

          echo "GEODE_CLI_HOME=$GEODE_CLI_HOME" >> $GITHUB_ENV

      # Install SDK
      - name: Install SDK
        run: geode sdk install

      # ✅ Install binaries WITH platform (critical)
      - name: Install binaries
        run: geode sdk install-binaries --platform ${{ matrix.cli }}

      # ✅ Build (skip internal broken binary install)
      - name: Build
        uses: geode-sdk/build-geode-mod@main
        with:
          target: ${{ matrix.target }}
          install-binaries: false
          use-cpm-cache: true
