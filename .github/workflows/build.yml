name: Build Geode Mod

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        target: [Android64, Win64]

    env:
      GEODE_CLI_HOME: ${{ github.workspace }}/geode-cli

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y ninja-build clang

      - name: Setup Geode CLI
        uses: geode-sdk/cli/.github/actions/setup@main

      # ✅ CREATE WORKING PROFILE (no prompts, no crashes)
      - name: Create Geode profile
        run: |
          mkdir -p "$GEODE_CLI_HOME"
          cat > "$GEODE_CLI_HOME/config.json" <<EOF
          {
            "current": "default",
            "profiles": {
              "default": {
                "name": "default",
                "platform": "android64",
                "gdPath": "$HOME",
                "geodePath": "$HOME"
              }
            }
          }
          EOF

      # ✅ Install SDK
      - name: Install Geode SDK
        run: |
          git clone --depth 1 --branch v5.3.0 https://github.com/geode-sdk/geode.git geode-sdk
          echo "GEODE_SDK=$GITHUB_WORKSPACE/geode-sdk" >> $GITHUB_ENV

      # ✅ Install binaries (NOW WORKS)
      - name: Install binaries
        run: geode sdk install-binaries --platform ${{ matrix.target }}

      # ✅ Build
      - name: Build
        run: |
          mkdir build
          cd build
          cmake .. -G Ninja -DGEODE_TARGET_PLATFORM=${{ matrix.target }}
          cmake --build .

      # ✅ Collect output
      - name: Collect .geode
        run: |
          mkdir -p output
          find build -name "*.geode" -exec cp {} output/ \;

      # ✅ Upload artifact
      - name: Upload .geode
        uses: actions/upload-artifact@v4
        with:
          name: geode-${{ matrix.target }}
          path: output/*.geode
