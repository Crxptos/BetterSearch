name: Build Geode Mod

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ✅ Install dependencies
      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y git cmake ninja-build unzip

      # ✅ Install Geode CLI (FIXED DOWNLOAD)
      - name: Install Geode CLI
        run: |
          mkdir geode-cli
          curl -L https://github.com/geode-sdk/cli/releases/download/v3.7.4/geode-cli-v3.7.4-linux.zip -o geode.zip
          unzip geode.zip -d geode-cli
          chmod +x geode-cli/geode
          echo "$PWD/geode-cli" >> $GITHUB_PATH

      # ✅ Setup Geode profile (NON-INTERACTIVE FIX)
      - name: Setup Geode profile
        run: |
          mkdir -p $HOME/.config/geode
          echo '{}' > $HOME/.config/geode/config.json

      # ✅ Install SDK + binaries
      - name: Install Geode SDK
        run: |
          geode sdk install geode-sdk
          geode sdk install-binaries

      # ✅ Export SDK path
      - name: Set GEODE_SDK
        run: echo "GEODE_SDK=$GITHUB_WORKSPACE/geode-sdk" >> $GITHUB_ENV

      # ✅ Build
      - name: Build Mod
        run: |
          mkdir build
          cd build
          cmake .. -G Ninja \
            -DGEODE_TARGET_PLATFORM=Android64 \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build . -j4

      # ✅ Upload output
      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: BetterSearch
          path: build/*.geode
