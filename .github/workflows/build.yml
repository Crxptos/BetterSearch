name: Build Geode Mod

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        target: [android64, win64]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ✅ Setup Geode CLI (handles SDK + profile automatically)
      - name: Setup Geode CLI
        uses: geode-sdk/cli/.github/actions/setup@main

      # ✅ Install SDK
      - name: Install SDK
        run: geode sdk install

      # ✅ Install correct binaries per platform
      - name: Install Binaries
        run: geode sdk install-binaries --platform ${{ matrix.target }}

      # ✅ Build using official Geode action
      - name: Build Mod
        uses: geode-sdk/build-geode-mod@main
        with:
          target: ${{ matrix.target }}
