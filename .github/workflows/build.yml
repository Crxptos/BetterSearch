name: Build Geode Mod

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        platform: [android64, win64]

    env:
      GEODE_CLI_HOME: ${{ github.workspace }}/geode-cli

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ✅ Install Geode CLI
      - name: Setup Geode CLI
        uses: geode-sdk/cli/.github/actions/setup@main

      # ✅ FORCE create config (fixes "No Geode profiles found")
      - name: Create Geode config
        run: |
          mkdir -p "$GEODE_CLI_HOME"
          echo '{
            "currentProfile": "default",
            "profiles": {
              "default": {
                "name": "default"
              }
            }
          }' > "$GEODE_CLI_HOME/config.json"

      # ✅ Install SDK (now works)
      - name: Install SDK
        run: geode sdk install

      # ✅ Install binaries (THIS fixes your loader error)
      - name: Install binaries
        run: geode sdk install-binaries --platform ${{ matrix.platform }}

      # ✅ Build
      - name: Build
        run: |
          mkdir build
          cd build
          cmake .. -G Ninja
          cmake --build .
