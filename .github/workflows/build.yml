name: Build Geode Mod

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        target: [Android64, Win64]  # ✅ FIXED CASE

    steps:
      - uses: actions/checkout@v4

      - name: Clean CLI
        run: rm -rf my-epic-geode-cli

      - name: Build Mod
        uses: geode-sdk/build-geode-mod@main
        with:
          target: ${{ matrix.target }}
          use-cpm-cache: true
