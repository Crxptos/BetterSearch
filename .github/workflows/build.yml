name: Build Geode Mod

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build

      - name: Setup Geode CLI
        uses: geode-sdk/cli/.github/actions/setup@main

      - name: Setup Geode profile
        run: |
          mkdir -p "$HOME/.geode"
          printf "GithubActions\nandroid64\n$HOME\n$HOME\n\n" | geode config setup

      # 🔥 EVERYTHING IN ONE STEP (CRITICAL)
      - name: Install SDK + binaries
        run: |
          export GEODE_SDK="$GITHUB_WORKSPACE/geode-sdk"
          geode sdk install "$GEODE_SDK"
          geode sdk set-path "$GEODE_SDK"
          geode sdk install-binaries --platform android64

      # 🔥 Build MUST also have export
      - name: Build
        run: |
          export GEODE_SDK="$GITHUB_WORKSPACE/geode-sdk"
          mkdir build
          cd build
          cmake .. -G Ninja -DGEODE_TARGET_PLATFORM=Android64 -DCMAKE_BUILD_TYPE=Release
          cmake --build . -j2

      - name: Upload .geode
        uses: actions/upload-artifact@v4
        with:
          name: BetterSearch-Android64
          path: "**/*.geode"
