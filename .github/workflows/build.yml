name: Build Geode Mod

on:
  push:
    branches: ["**"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y git cmake ninja-build unzip curl

      # ✅ Clone SDK manually (NO geode CLI)
      - name: Clone Geode SDK
        run: |
          git clone --depth=1 https://github.com/geode-sdk/geode.git geode-sdk

      # ✅ Set environment variable
      - name: Set GEODE_SDK
        run: echo "GEODE_SDK=$GITHUB_WORKSPACE/geode-sdk" >> $GITHUB_ENV

      # ✅ Install prebuilt binaries (fixes Codegen error)
      - name: Install Geode Binaries
        run: |
          mkdir -p geode-sdk/bin/android64
          curl -L https://github.com/geode-sdk/geode/releases/download/v5.3.0/android64.zip -o android.zip
          unzip android.zip -d geode-sdk/bin/android64

      # ✅ Build
      - name: Build Mod
        run: |
          mkdir build
          cd build
          cmake .. -G Ninja \
            -DGEODE_TARGET_PLATFORM=Android64 \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build . -j2

      # ✅ Upload artifact
      - name: Upload Build
        uses: actions/upload-artifact@v4
        with:
          name: BetterSearch-Android64
          path: build/*.so
