name: Build Geode Mod

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        target: [Android64, Win64]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Install dependencies
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build

      # Increase memory (prevents random cancel)
      - name: Increase swap
        run: |
          sudo fallocate -l 2G /myswap || true
          sudo chmod 600 /myswap
          sudo mkswap /myswap || true
          sudo swapon /myswap || true

      # 🚀 Build (NO CACHE = FIXES YOUR ERROR)
      - name: Build mod
        uses: geode-sdk/build-geode-mod@main
        with:
          target: ${{ matrix.target }}
          use-cpm-cache: false

      # Upload result
      - name: Upload .geode
        uses: actions/upload-artifact@v4
        with:
          name: geode-${{ matrix.target }}
          path: "**/*.geode"
