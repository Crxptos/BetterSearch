name: Build Geode Mod

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        target: [android64, win64]

    steps:
      - uses: actions/checkout@v4

      # ✅ Install CLI FIRST
      - name: Setup Geode CLI
        uses: geode-sdk/cli/.github/actions/setup@main

      # ✅ Create profile in REAL location (~/.geode)
      - name: Create Geode profile
        run: |
          mkdir -p ~/.geode
          echo '{
            "currentProfile": "default",
            "profiles": {
              "default": {
                "name": "default"
              }
            }
          }' > ~/.geode/config.json

      # ✅ Now this WILL work
      - name: Install SDK
        run: geode sdk install

      - name: Install Binaries
        run: geode sdk install-binaries --platform ${{ matrix.target }}

      - name: Build
        uses: geode-sdk/build-geode-mod@main
        with:
          target: ${{ matrix.target }}
