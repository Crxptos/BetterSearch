name: Build Geode Mod

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      GEODE_CLI_HOME: ${{ github.workspace }}/geode-cli

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Android64
            cli: android64
          - platform: Win64
            cli: win64

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Setup Geode CLI
        uses: geode-sdk/cli/.github/actions/setup@main

      # ✅ FIX: create config in the CORRECT location
      - name: Setup Geode profile
        run: |
          mkdir -p "$GEODE_CLI_HOME"
          echo '{"currentProfile":"default","profiles":{"default":{"name":"default"}}}' > "$GEODE_CLI_HOME/config.json"

      - name: Install SDK
        run: geode sdk install

      - name: Install binaries
        run: geode sdk install-binaries --platform ${{ matrix.cli }}

      - name: Build
        run: |
          mkdir build
          cd build
          cmake .. -G Ninja -DGEODE_TARGET_PLATFORM=${{ matrix.platform }}
          cmake --build .
