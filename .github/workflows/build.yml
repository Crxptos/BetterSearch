name: Build Geode Mod

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        platform: [Android64, Win64]

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Build
        run: |
          mkdir build
          cd build
          cmake .. -G Ninja -DGEODE_TARGET_PLATFORM=${{ matrix.platform }}
          cmake --build .
