name: Build Geode Mod

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        platform: [android32, android64, win64]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 🔧 Install Geode CLI + SDK properly
      - name: Setup Geode
        uses: geode-sdk/cli/.github/actions/setup@main

      # 🔧 IMPORTANT: install binaries manually (THIS FIXES YOUR ERROR)
      - name: Install Geode Binaries
        run: geode sdk install-binaries

      # 🚀 Build
      - name: Build mod
        uses: geode-sdk/build-geode-mod@main
        with:
          platform: ${{ matrix.platform }}
