name: Build Geode Mod

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        platform: [android32, android64, win64]

    steps:
      - uses: actions/checkout@v4

      # 🔥 Setup Geode AND keep profile
      - name: Setup Geode CLI
        uses: geode-sdk/cli/.github/actions/setup@main

      # 🔥 CRITICAL FIX: reuse same profile path
      - name: Install binaries (FIXED)
        run: |
          export CLI_PROFILE="$GITHUB_WORKSPACE/cli-profile"
          geode sdk install-binaries

      # 🔥 Build using SAME profile
      - name: Build mod
        run: |
          export CLI_PROFILE="$GITHUB_WORKSPACE/cli-profile"
          geode build -p ${{ matrix.platform }}
