name: Build Geode Mod

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        platform: [android64, win64]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build mod
        uses: geode-sdk/build-geode-mod@main
        env:
          GEODE_TARGET_PLATFORM: ${{ matrix.platform }}
          GEODE_SDK: ${{ github.workspace }}/.geode
