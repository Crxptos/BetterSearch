name: Build Geode Mod

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        platform: [android32, android64, win64]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Setup Geode (this already creates a profile)
      - name: Setup Geode
        uses: geode-sdk/cli/.github/actions/setup@main

      # 🔧 IMPORTANT: set CLI_PROFILE so commands use the created profile
      - name: Set CLI Profile
        run: echo "CLI_PROFILE=$GITHUB_WORKSPACE/cli-profile" >> $GITHUB_ENV

      # 🔧 Install binaries (now it knows where the profile is)
      - name: Install Geode Binaries
        run: geode sdk install-binaries

      # 🚀 Build
      - name: Build mod
        uses: geode-sdk/build-geode-mod@main
        with:
          platform: ${{ matrix.platform }}
