name: Build Geode Mod

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Android64
            cli: android64
          - platform: Win64
            cli: win64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Install dependencies
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y ninja-build p7zip-full

      # Setup Geode CLI (SAFE — no conflicts)
      - name: Setup Geode CLI
        uses: geode-sdk/cli/.github/actions/setup@main

      # Create CLI profile NON-INTERACTIVELY (REAL FIX)
      - name: Setup Geode profile
        run: |
          export GEODE_CLI_HOME="$GITHUB_WORKSPACE/geode-cli"
          mkdir -p "$GEODE_CLI_HOME"

          # Manually create profile file (avoids broken interactive setup)
          mkdir -p "$GEODE_CLI_HOME/profiles"
          cat > "$GEODE_CLI_HOME/profiles/default.json" <<EOF
          {
            "name": "default",
            "platform": "${{ matrix.cli }}",
            "gd_path": "/tmp",
            "sdk_path": "$GITHUB_WORKSPACE/geode-sdk"
          }
          EOF

          echo "GEODE_CLI_HOME=$GEODE_CLI_HOME" >> $GITHUB_ENV

      # Install SDK (NOW WORKS because profile exists)
      - name: Install SDK
        run: geode sdk install "$GITHUB_WORKSPACE/geode-sdk"

      # Install binaries (CRITICAL FIX)
      - name: Install binaries
        run: geode sdk install-binaries --platform ${{ matrix.cli }}

      # Build mod
      - name: Build
        uses: geode-sdk/build-geode-mod@main
        with:
          target: ${{ matrix.platform }}
          use-cpm-cache: true

      # ✅ Upload .geode files
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: geode-${{ matrix.platform }}
          path: output/*.geode
