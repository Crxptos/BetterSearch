name: Build Geode Mod

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        target: [Android64, Win64]

    env:
      GEODE_CLI_HOME: ${{ github.workspace }}/geode-cli

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y ninja-build clang

      - name: Setup Geode CLI
        uses: geode-sdk/cli/.github/actions/setup@main

      # ✅ Create Geode CLI profile (NON-INTERACTIVE, FIXED)
      - name: Setup Geode profile
        run: |
          mkdir -p "$GEODE_CLI_HOME"
          printf "default\nAndroid64\n$HOME\n$HOME\n\n" | geode config setup

      # ✅ Install Geode SDK manually
      - name: Install Geode SDK
        run: |
          git clone --depth 1 --branch v5.3.0 https://github.com/geode-sdk/geode.git geode-sdk
          echo "GEODE_SDK=$GITHUB_WORKSPACE/geode-sdk" >> $GITHUB_ENV

      # ✅ Install platform binaries (NOW WORKS)
      - name: Install binaries
        run: geode sdk install-binaries --platform ${{ matrix.target }}

      # ✅ Build the mod (manual, stable)
      - name: Build
        run: |
          mkdir build
          cd build
          cmake .. -G Ninja -DGEODE_TARGET_PLATFORM=${{ matrix.target }}
          cmake --build .

      # ✅ Collect .geode output
      - name: Collect .geode
        run: |
          mkdir -p output
          find build -name "*.geode" -exec cp {} output/ \;

      # ✅ Upload artifact (THIS is what shows on GitHub)
      - name: Upload .geode
        uses: actions/upload-artifact@v4
        with:
          name: geode-${{ matrix.target }}
          path: output/*.geode
