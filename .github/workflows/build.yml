name: Build Geode Mod

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - target: Android64
            cli: android64
          - target: Win64
            cli: win64

    steps:
      - uses: actions/checkout@v4

      # Install dependencies
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y ninja-build p7zip-full

      # Install Geode CLI
      - name: Setup Geode CLI
        uses: geode-sdk/cli/.github/actions/setup@main

      # ✅ FINAL FIX: manual profile (NO interactive setup)
      - name: Setup Geode profile
        run: |
          export GEODE_CLI_HOME="$GITHUB_WORKSPACE/geode-cli"
          mkdir -p "$GEODE_CLI_HOME/profiles"

          # Create config
          cat > "$GEODE_CLI_HOME/config.json" <<EOF
          {
            "currentProfile": "GithubActions"
          }
          EOF

          # Create profile
          cat > "$GEODE_CLI_HOME/profiles/GithubActions.json" <<EOF
          {
            "name": "GithubActions",
            "platform": "android64"
          }
          EOF

          echo "GEODE_CLI_HOME=$GEODE_CLI_HOME" >> $GITHUB_ENV

      # Install SDK
      - name: Install SDK
        run: geode sdk install

      # Install binaries (IMPORTANT)
      - name: Install binaries
        run: geode sdk install-binaries --platform ${{ matrix.cli }}

      # Build mod
      - name: Build
        uses: geode-sdk/build-geode-mod@main
        with:
          target: ${{ matrix.target }}
          install-binaries: false
          use-cpm-cache: true
