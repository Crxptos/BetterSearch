name: Build Geode Mod

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - target: Android64
            cli: android64
          - target: Win64
            cli: win64

    steps:
      - uses: actions/checkout@v4

      # Install dependencies
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      # Install Geode CLI (official action)
      - name: Setup Geode CLI
        uses: geode-sdk/cli/.github/actions/setup@main

      # ✅ Install SDK WITHOUT profiles
      - name: Install SDK
        run: |
          git clone --depth 1 --branch v5.3.0 https://github.com/geode-sdk/geode.git geode-sdk
          echo "GEODE_SDK=$GITHUB_WORKSPACE/geode-sdk
