name: Build Geode Mod

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      # Install dependencies
      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y ninja-build cmake git unzip

      # Setup Geode CLI
      - name: Setup Geode CLI
        run: |
          mkdir -p my-epic-geode-cli
          curl -L https://github.com/geode-sdk/cli/releases/latest/download/geode-cli-linux.zip -o geode.zip
          unzip geode.zip -d my-epic-geode-cli
          chmod +x my-epic-geode-cli/geode
          echo "$PWD/my-epic-geode-cli" >> $GITHUB_PATH

      # Setup Geode (THIS FIXES YOUR ERROR)
      - name: Setup Geode SDK
        run: |
          export CLI_PROFILE="$GITHUB_WORKSPACE/cli-profile"
          geode config setup

          geode sdk install geode-sdk
          geode sdk install-binaries

          echo "GEODE_SDK=$GITHUB_WORKSPACE/geode-sdk" >> $GITHUB_ENV

      # Build
      - name: Build mod
        run: |
          mkdir build
          cd build

          cmake .. -G Ninja \
            -DGEODE_TARGET_PLATFORM=Android64 \
            -DGEODE_SDK="$GEODE_SDK" \
            -DCMAKE_BUILD_TYPE=Release

          cmake --build . -j2

      # Upload artifacts
      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: BetterSearch
          path: build/**/*.geode
