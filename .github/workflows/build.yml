name: Build Geode Mod

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        platform: [android32, android64, win64]

    steps:
      - uses: actions/checkout@v4

      # ✅ Official Geode setup (handles profile automatically)
      - name: Setup Geode
        uses: geode-sdk/cli/.github/actions/setup@main

      # ✅ FIX: install binaries AFTER setup
      - name: Install Geode binaries
        run: geode sdk install-binaries

      # ✅ Build
      - name: Build mod
        uses: geode-sdk/build-geode-mod@main
        with:
          platform: ${{ matrix.platform }}
