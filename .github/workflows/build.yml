name: Build Geode Mod

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Android64
            cli: android64
          - platform: Win64
            cli: win64

    steps:
      - uses: actions/checkout@v4

      # Install dependencies
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      # Install Geode CLI
      - name: Setup Geode CLI
        uses: geode-sdk/cli/.github/actions/setup@main

      # Create non-interactive CLI profile (fixes crash)
      - name: Setup Geode profile
        run: |
          mkdir -p ~/.config/geode
          echo '{"currentProfile":"default","profiles":{"default":{"name":"default"}}}' > ~/.config/geode/config.json

      # Install SDK
      - name: Install SDK
        run: geode sdk install

      # Install binaries (REQUIRED for Codegen)
      - name: Install binaries
        run: geode sdk install-binaries --platform ${{ matrix.cli }}

      # Build with CMake + CPM
      - name: Build
        run: |
          mkdir build
          cd build
          cmake .. -G Ninja -DGEODE_TARGET_PLATFORM=${{ matrix.platform }}
          cmake --build .
