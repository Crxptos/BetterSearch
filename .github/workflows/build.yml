name: Build Geode Mod

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      GEODE_CLI_HOME: ${{ github.workspace }}/geode-cli

    strategy:
      fail-fast: false
      matrix:
        include:
          - target: Android64
            cli: android64
          - target: Win64
            cli: win64

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y ninja-build p7zip-full

      - name: Setup Geode CLI
        uses: geode-sdk/cli/.github/actions/setup@main

      # ✅ REAL FIX: create profile properly
      - name: Setup Geode profile (non-interactive)
        run: |
          mkdir -p "$GEODE_CLI_HOME"

          # Feed ALL required inputs properly
          printf "GithubActions\nandroid64\n$HOME\n$HOME\n\n" | geode config setup

      - name: Install SDK
        run: geode sdk install

      - name: Install binaries
        run: geode sdk install-binaries --platform ${{ matrix.cli }}

      - name: Build
        uses: geode-sdk/build-geode-mod@main
        with:
          target: ${{ matrix.target }}
          install-binaries: false
          use-cpm-cache: true
