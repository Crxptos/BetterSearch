name: Build Geode Mod

on:
  push:
    branches: ['**']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 📥 Checkout repo
      - name: Checkout
        uses: actions/checkout@v4

      # 🧰 Install dependencies
      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y git cmake ninja-build unzip curl

      # ⚙️ Install Geode CLI (FIXED download)
      - name: Install Geode CLI
        run: |
          mkdir -p geode-cli
          curl -L https://github.com/geode-sdk/cli/releases/download/v3.7.4/geode-cli-v3.7.4-linux.zip -o geode.zip
          unzip geode.zip -d geode-cli
          chmod +x geode-cli/geode
          echo "$PWD/geode-cli" >> $GITHUB_PATH

      # 🧠 Create Geode profile (CRITICAL FIX)
      - name: Create Geode profile
        run: |
          mkdir -p $HOME/.config/geode
          cat > $HOME/.config/geode/config.json <<EOF
          {
            "currentProfile": "default",
            "profiles": {
              "default": {
                "name": "default",
                "gdPath": "",
                "platform": "android64"
              }
            }
          }
          EOF

      # 📦 Install SDK + binaries
      - name: Install Geode SDK
        run: |
          geode sdk install geode-sdk
          geode sdk install-binaries

      # 🌍 Export SDK path
      - name: Set GEODE_SDK
        run: echo "GEODE_SDK=$GITHUB_WORKSPACE/geode-sdk" >> $GITHUB_ENV

      # 🔨 Build mod
      - name: Build
        run: |
          mkdir build
          cd build
          cmake .. -G Ninja \
            -DGEODE_TARGET_PLATFORM=Android64 \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build . -j2

      # 📦 Upload artifact
      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: BetterSearch-Android64
          path: build/*.so
