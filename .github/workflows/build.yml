name: Build Geode Mod

on:
  push:
    branches: ['**']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 📥 Get your code
      - name: Checkout
        uses: actions/checkout@v4

      # 🔨 Build using official Geode action (does EVERYTHING)
      - name: Build Mod
        uses: geode-sdk/build-geode-mod@main
        with:
          target: Android64
          combine: true

      # 📤 Upload output
      - name: Upload Build
        uses: actions/upload-artifact@v4
        with:
          name: BetterSearch
          path: build/*.geode
