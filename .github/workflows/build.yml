name: Build Geode Mod

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        platform: [android64, win64]

    env:
      GEODE_CLI_HOME: ${{ github.workspace }}/geode-cli

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ✅ Create Geode profile manually (FIXES YOUR ERROR)
      - name: Setup Geode Profile
        run: |
          mkdir -p "$GEODE_CLI_HOME"
          echo '{
            "currentProfile": "default",
            "profiles": {
              "default": {}
            }
          }' > "$GEODE_CLI_HOME/config.json"

      - name: Setup Geode CLI
        uses: geode-sdk/cli/.github/actions/setup@main

      - name: Install SDK
        run: |
          geode sdk install
          geode sdk update

      # ✅ IMPORTANT: pass platform correctly
      - name: Install Binaries
        run: |
          geode sdk install-binaries --platform ${{ matrix.platform }}

      - name: Build
        run: |
          mkdir build
          cd build
          cmake .. -G Ninja
          cmake --build .
