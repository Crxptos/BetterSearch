name: Build Geode Mod

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - target: Android64
            cli: android64
          - target: Win64
            cli: win64

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y ninja-build p7zip-full

      # Setup CLI
      - name: Setup Geode CLI
        uses: geode-sdk/cli/.github/actions/setup@main

      # ✅ Create CLI profile (REQUIRED)
      - name: Setup profile
        run: |
          export GEODE_CLI_HOME="$GITHUB_WORKSPACE/geode-cli"
          mkdir -p "$GEODE_CLI_HOME"

          cat > "$GEODE_CLI_HOME/config.json" <<EOF
          {
            "currentProfile": "default",
            "profiles": {
              "default": {
                "name": "default"
              }
            }
          }
          EOF

          echo "GEODE_CLI_HOME=$GEODE_CLI_HOME" >> $GITHUB_ENV

      # Install SDK
      - name: Install SDK
        run: geode sdk install

      # ✅ CRITICAL FIX (YOU CONTROL PLATFORM HERE)
      - name: Install Binaries
        run: geode sdk install-binaries --platform ${{ matrix.cli }}

      # ✅ Build WITHOUT reinstalling binaries
      - name: Build
        uses: geode-sdk/build-geode-mod@main
        with:
          target: ${{ matrix.target }}
          use-cpm-cache: true
          install-binaries: false   # 🔥 THIS LINE FIXES YOUR ERROR
