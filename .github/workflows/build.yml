name: Build Geode Mod

on:
push:
pull_request:

jobs:
build:
runs-on: ubuntu-latest

env:
  GEODE_CLI_HOME: ${{ github.workspace }}/geode-cli

steps:
  - uses: actions/checkout@v4

  - name: Setup Geode profile
    run: |
      mkdir -p "$GEODE_CLI_HOME"
      cat > "$GEODE_CLI_HOME/config.json" <<EOF

{
"currentProfile": "default",
"profiles": {
"default": {
"name": "default"
}
}
}
EOF

  - name: Setup Geode CLI
    uses: geode-sdk/cli/.github/actions/setup@main

  - name: Install SDK
    run: |
      geode sdk install
      geode sdk update

  - name: Install binaries
    run: |
      geode sdk install-binaries --platform android64

  - name: Build
    run: |
      mkdir build
      cd build
      cmake .. -G Ninja
      cmake --build .
