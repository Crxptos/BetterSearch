name: Build Geode Mod

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      GEODE_CLI_HOME: ${{ github.workspace }}/geode-cli

    strategy:
      fail-fast: false
      matrix:
        include:
          - target: Android64
            cli: android64
          - target: Win64
            cli: win64

    steps:
      - uses: actions/checkout@v4

      # Install dependencies
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      # Install Geode CLI
      - name: Setup Geode CLI
        uses: geode-sdk/cli/.github/actions/setup@main

      # 🔥 FIXED: Create VALID CLI profile + config
      - name: Setup Geode profile
        run: |
          mkdir -p "$GEODE_CLI_HOME/profiles"

          cat > "$GEODE_CLI_HOME/profiles/default.json" <<EOF
          {
            "name": "default",
            "platform": "${{ matrix.cli }}",
            "gd_path": "/tmp",
            "sdk_path": "$GITHUB_WORKSPACE/geode-sdk"
          }
          EOF

          cat > "$GEODE_CLI_HOME/config.json" <<EOF
          {
            "current_profile": "default"
          }
          EOF

      # Install SDK
      - name: Install SDK
        run: geode sdk install "$GITHUB_WORKSPACE/geode-sdk"

      # Export SDK path
      - name: Set GEODE_SDK
        run: echo "GEODE_SDK=$GITHUB_WORKSPACE/geode-sdk" >> $GITHUB_ENV

      # Install platform binaries (CRITICAL FIX)
      - name: Install binaries
        run: geode sdk install-binaries --platform ${{ matrix.cli }}

      # Build mod
      - name: Build
        uses: geode-sdk/build-geode-mod@main
        with:
          target: ${{ matrix.target }}
          install-binaries: false
          use-cpm-cache: true

      # 📦 Upload .geode files (THIS is what you want!)
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: BetterSearch-${{ matrix.target }}
          path: |
            build/**/*.geode
            output/**/*.geode
