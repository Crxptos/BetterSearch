name: Build Geode Mod

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        platform: [android32, android64, win64]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Setup Geode CLI
      - name: Setup Geode
        uses: geode-sdk/cli/.github/actions/setup@main

      # 🔧 CREATE PROFILE (THIS FIXES YOUR ERROR)
      - name: Setup Geode Profile
        run: |
          geode config setup --profile GithubActions

      # 🔧 Install SDK + binaries
      - name: Install Geode SDK & Binaries
        run: |
          geode sdk install
          geode sdk install-binaries

      # 🚀 Build
      - name: Build mod
        uses: geode-sdk/build-geode-mod@main
        with:
          platform: ${{ matrix.platform }}
