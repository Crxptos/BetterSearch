name: Build Geode Mod

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        target: [Android64, Win64]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 🚀 Build using official Geode action (handles SDK + binaries)
      - name: Build mod
        uses: geode-sdk/build-geode-mod@main
        with:
          target: ${{ matrix.target }}
          use-cpm-cache: true

      # 🔍 Debug (VERY IMPORTANT)
      - name: Debug output
        run: |
          echo "Searching for .geode files..."
          find . -name "*.geode"

      # 📦 Upload artifact
      - name: Upload .geode
        uses: actions/upload-artifact@v4
        with:
          name: geode-${{ matrix.target }}
          path: |
            build/**/*.geode
            **/*.geode
