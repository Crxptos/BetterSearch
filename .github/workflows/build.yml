name: Build Geode Mod

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        target: [Android64, Win64]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ✅ Install dependencies
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build clang lld

      # ✅ Add swap (prevents cancellation)
      - name: Increase swap
        run: |
          sudo fallocate -l 2G /myswap
          sudo chmod 600 /myswap
          sudo mkswap /myswap
          sudo swapon /myswap

      # ✅ Build (OFFICIAL + CORRECT)
      - name: Build mod
        uses: geode-sdk/build-geode-mod@main
        with:
          target: ${{ matrix.target }}
          use-cpm-cache: true

      # ✅ Upload result
      - name: Upload .geode
        uses: actions/upload-artifact@v4
        with:
          name: geode-${{ matrix.target }}
          path: |
            build/**/*.geode
            **/*.geode
