name: Build Geode Mod

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - target: Android64
          - target: Win64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Install dependencies
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      # Install Geode CLI (ONLY method used)
      - name: Setup Geode CLI
        uses: geode-sdk/cli/.github/actions/setup@main

      # Install Geode SDK manually (no profile needed)
      - name: Install SDK
        run: |
          git clone --depth 1 --branch v5.3.0 https://github.com/geode-sdk/geode.git geode-sdk
          echo "GEODE_SDK=$GITHUB_WORKSPACE/geode-sdk" >> $GITHUB_ENV

      # Build mod
      - name: Build
        uses: geode-sdk/build-geode-mod@main
        with:
          target: ${{ matrix.target }}
          use-cpm-cache: true

      # Upload .geode file as artifact
      - name: Upload .geode artifact
        uses: actions/upload-artifact@v4
        with:
          name: geode-${{ matrix.target }}
          path: output/*.geode
