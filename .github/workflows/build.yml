name: Build Geode Mod

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      CLI_PROFILE: ${{ github.workspace }}/cli-profile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Geode profile
        run: |
          mkdir -p "$CLI_PROFILE"
          echo '{"currentProfile":"default","profiles":{"default":{"name":"default"}}}' > "$CLI_PROFILE/config.json"

      - name: Setup Geode CLI
        uses: geode-sdk/cli/.github/actions/setup@main

      - name: Install SDK
        run: |
          geode sdk install
          geode sdk update

      - name: Install binaries
        run: |
          geode sdk install-binaries --platform android64

      - name: Build
        run: |
          mkdir build
          cd build
          cmake .. -G Ninja
          cmake --build .
