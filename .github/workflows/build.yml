name: Build Geode Mod

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      GEODE_CLI_HOME: ${{ github.workspace }}/geode-cli

    strategy:
      fail-fast: false
      matrix:
        include:
          - target: Android64
            cli: android64
          - target: Win64
            cli: win64

    steps:
      - uses: actions/checkout@v4

      # Install required tools
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      # ✅ Install Geode CLI (ONLY THIS, no manual download!)
      - name: Setup Geode CLI
        uses: geode-sdk/cli/.github/actions/setup@main

      # ✅ Create CLI profile (non-interactive, no crash)
      - name: Setup Geode profile
        run: |
          mkdir -p "$GEODE_CLI_HOME"
          printf "GithubActions\nandroid64\n$HOME\n$HOME\n\n" | geode config setup

      # ✅ Install SDK to known location
      - name: Install SDK
        run: geode sdk install "$GITHUB_WORKSPACE/geode-sdk"

      # ✅ Export SDK path
      - name: Set GEODE_SDK
        run: echo "GEODE_SDK=$GITHUB_WORKSPACE/geode-sdk" >> $GITHUB_ENV

      # ✅ Install binaries per platform (FIXES your main error)
      - name: Install binaries
        run: geode sdk install-binaries --platform ${{ matrix.cli }}

      # ✅ Build (no duplicate installs, no conflicts)
      - name: Build
        uses: geode-sdk/build-geode-mod@main
        with:
          target: ${{ matrix.target }}
          install-binaries: false
          use-cpm-cache: true
      
      # ✅️ Upload artifacts (.geode file)
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: geode-build-${{ matrix.platform }}
          path: output/*.geode
