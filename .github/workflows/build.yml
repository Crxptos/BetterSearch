name: Build Geode Mod

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Geode CLI
        uses: geode-sdk/cli/.github/actions/setup@main

      # ✅ FORCE create profile (non-interactive workaround)
      - name: Create Geode profile
        run: |
          mkdir -p ~/.geode
          echo '{"currentProfile":"default","profiles":{"default":{"name":"default"}}}' > ~/.geode/config.json

      - name: Install SDK
        run: |
          geode sdk install
          geode sdk update

      - name: Install binaries
        run: |
          geode sdk install-binaries --platform android64

      - name: Build
        run: |
          mkdir build
          cd build
          cmake .. -G Ninja
          cmake --build .
