name: Build Geode Mod

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      GEODE_CLI_HOME: ${{ github.workspace }}/geode-cli

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Geode CLI
        uses: geode-sdk/cli/.github/actions/setup@main

      - name: Create Geode profile (NON-INTERACTIVE FIX)
        run: |
          mkdir -p "$GEODE_CLI_HOME"
          echo '{
            "currentProfile": "default",
            "profiles": {
              "default": {
                "name": "default"
              }
            }
          }' > "$GEODE_CLI_HOME/config.json"

      - name: Install SDK
        run: |
          geode sdk install
          geode sdk update

      - name: Install Android64 binaries
        run: |
          geode sdk install-binaries --platform android64

      - name: Build
        run: |
          mkdir build
          cd build
          cmake .. -G Ninja
          cmake --build .
