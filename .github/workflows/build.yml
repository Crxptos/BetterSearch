name: Build Geode Mod

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # -----------------------------
      # Install dependencies
      # -----------------------------
      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y cmake ninja-build git unzip curl

      # -----------------------------
      # Download Geode CLI (FIXED)
      # -----------------------------
      - name: Setup Geode CLI
        run: |
          mkdir -p geode-cli

          curl -L https://github.com/geode-sdk/cli/releases/download/v3.7.4/geode-cli-v3.7.4-linux.zip -o geode.zip
          unzip geode.zip -d geode-cli

          chmod +x geode-cli/geode
          echo "$PWD/geode-cli" >> $GITHUB_PATH

      # -----------------------------
      # Setup Geode profile (IMPORTANT)
      # -----------------------------
      - name: Setup Geode Profile
        run: |
          geode config setup --silent

      # -----------------------------
      # Install SDK + binaries
      # -----------------------------
      - name: Install Geode SDK
        run: |
          geode sdk install geode-sdk
          geode sdk install-binaries

          echo "GEODE_SDK=$GITHUB_WORKSPACE/geode-sdk" >> $GITHUB_ENV

      # -----------------------------
      # Build mod
      # -----------------------------
      - name: Build
        run: |
          mkdir build
          cd build

          cmake .. -G Ninja \
            -DGEODE_TARGET_PLATFORM=Android64 \
            -DGEODE_SDK="$GEODE_SDK" \
            -DCMAKE_BUILD_TYPE=Release

          cmake --build . -j2

      # -----------------------------
      # Upload artifact (.geode file)
      # -----------------------------
      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: BetterSearch
          path: build/*.geode
