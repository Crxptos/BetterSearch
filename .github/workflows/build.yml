name: Build Geode Mod

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        target: [android64, win64]

    steps:
      - uses: actions/checkout@v4

      # 🔥 Fix: delete CLI folder before setup (prevents overwrite prompt)
      - name: Clean CLI
        run: rm -rf my-epic-geode-cli

      - name: Build Mod
        uses: geode-sdk/build-geode-mod@main
        with:
          target: ${{ matrix.target }}
          use-cpm-cache: true
