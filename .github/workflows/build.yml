name: Build Geode Mod

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        target: [Android64, Win64]

    env:
      GEODE_CLI_HOME: ${{ github.workspace }}/geode-cli

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ✅ Install dependencies (Clang + Ninja + LLD)
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build clang lld

      # ✅ Add swap (prevents random "operation canceled")
      - name: Increase swap
        run: |
          sudo fallocate -l 2G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile

      # ✅ Setup Geode CLI
      - name: Setup Geode CLI
        uses: geode-sdk/cli/.github/actions/setup@main

      # ✅ Create Geode profile (FIXED)
      - name: Setup Geode profile
        run: |
          mkdir -p "$GEODE_CLI_HOME"
          printf "default\nAndroid64\n$HOME\n$HOME\n\n" | geode config setup

      # ✅ Install Geode SDK manually
      - name: Install Geode SDK
        run: |
          git clone --depth 1 --branch v5.3.0 https://github.com/geode-sdk/geode.git geode-sdk
          echo "GEODE_SDK=$GITHUB_WORKSPACE/geode-sdk" >> $GITHUB_ENV

      # ✅ Install binaries per platform
      - name: Install binaries
        run: geode sdk install-binaries --platform ${{ matrix.target }}

      # ✅ Build (stable config)
      - name: Build
        run: |
          mkdir build
          cd build
          cmake .. -G Ninja \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DGEODE_TARGET_PLATFORM=${{ matrix.target }}

          cmake --build . --parallel 2

      # ✅ Collect .geode files
      - name: Collect .geode
        run: |
          mkdir -p output
          find build -name "*.geode" -exec cp {} output/ \;

      # ✅ Upload artifacts (THIS is what you download)
      - name: Upload .geode
        uses: actions/upload-artifact@v4
        with:
          name: geode-${{ matrix.target }}
          path: output/*.geode
