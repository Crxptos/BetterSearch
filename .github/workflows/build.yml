name: Build Geode Mod

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        target: [Android64]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Setup Geode CLI
        uses: geode-sdk/cli/.github/actions/setup@main

      - name: Install SDK
        run: |
          geode sdk install geode-sdk
          echo "GEODE_SDK=$GITHUB_WORKSPACE/geode-sdk" >> $GITHUB_ENV

      - name: Install Binaries
        run: geode sdk install-binaries

      - name: Build
        run: geode build -p Android64

      - name: Upload mod
        uses: actions/upload-artifact@v4
        with:
          name: BetterSearch
          path: build/*.geode
