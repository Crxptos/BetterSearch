name: Build Geode Mod

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        platform: [android64, win64] # (skip android32 for now)

    steps:
      - uses: actions/checkout@v4

      - name: Setup Geode CLI
        uses: geode-sdk/cli/.github/actions/setup@main

      - name: Setup Geode SDK
        run: |
          geode sdk install
          geode sdk update

      - name: Install platform binaries
        run: |
          geode sdk install-binaries --platform ${{ matrix.platform }}

      - name: Build mod
        run: |
          mkdir build
          cd build
          cmake .. -G Ninja
          cmake --build .
